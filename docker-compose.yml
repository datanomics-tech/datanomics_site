# One-command setup on any server with Docker:  docker compose up -d
services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-datanomics}
      MYSQL_USER: ${DB_USER:-datanomics}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change-this-root-password}
    volumes: [ "dbdata:/var/lib/mysql" ]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 10
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
    ports: [ "3000:3000" ]
    volumes: [ "uploads:/app/public/uploads" ]
    depends_on:
      db: { condition: service_healthy }
volumes:
  dbdata:
  uploads:
