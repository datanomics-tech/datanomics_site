# /etc/nginx/sites-available/datanomics  (then: ln -s ... sites-enabled/, nginx -t, systemctl reload nginx)
server {
  listen 80;
  server_name datanomics.rw www.datanomics.rw;
  client_max_body_size 6m;
  location / {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
# HTTPS: sudo certbot --nginx -d datanomics.rw -d www.datanomics.rw
